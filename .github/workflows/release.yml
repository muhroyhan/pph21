name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No `registry-url` here on purpose: it makes setup-node write an .npmrc
      # containing a literal `${NODE_AUTH_TOKEN}` placeholder, which semantic-release
      # mistakes for working auth and so never injects NPM_TOKEN — the publish then
      # fails with EINVALIDNPMTOKEN. semantic-release writes its own .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # develop is the default/working branch; main only exists to trigger
      # releases. semantic-release's version-bump commit lands on main, so
      # without this, develop's package.json/CHANGELOG.md permanently lag
      # behind whatever last got published. No-op (prints "Already up to
      # date") when semantic-release didn't release anything this run.
      - name: Sync main back into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge --no-edit origin/main
          git push origin develop
