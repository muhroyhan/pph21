name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No `registry-url` here on purpose: it makes setup-node write an .npmrc
      # containing a literal `${NODE_AUTH_TOKEN}` placeholder, which semantic-release
      # mistakes for working auth and so never injects NPM_TOKEN — the publish then
      # fails with EINVALIDNPMTOKEN. semantic-release writes its own .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
